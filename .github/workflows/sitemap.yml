name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'scripts/generate_sitemap.py'
      - 'generate_rss.py'
      - 'scripts/audit_site.py'
      - '.github/workflows/sitemap.yml'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate lastmod times

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Sitemap
        run: python scripts/generate_sitemap.py

      - name: Generate RSS
        run: python generate_rss.py

      - name: Validate site links and metadata
        run: python scripts/audit_site.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update sitemap and RSS"
          file_pattern: 'sitemap.xml rss.xml'
